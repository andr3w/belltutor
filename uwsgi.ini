#sudo ln -s /var/www/learn/uwsgi.ini /etc/uwsgi/apps-enabled/learn.ini
[uwsgi]
plugins = python3
chdir = /var/www/learn
module = server:app
# Flask comes from the recording app's venv rather than a second one for a single import.
pythonpath = /var/www/learn/venv/lib/python3.13/site-packages/
max-requests=5000
socket = /tmp/learn.sock
chmod-socket = 666
vacuum = true
uid = www-data
gid = www-data
processes = 2
threads = 2
touch-reload = /tmp/learn.touchme
