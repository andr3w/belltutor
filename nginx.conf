#sudo ln -s /var/www/learn/nginx.conf /etc/nginx/sites-enabled/learn.conf
server{
  server_name pullrope.net;
  location /{
	  include uwsgi_params;
	  uwsgi_pass unix:/tmp/learn.sock;
  }
  location /static{
	  root /var/www/learn;
  }

  listen 443 ssl;
  ssl_certificate /etc/letsencrypt/live/pullrope.net/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pullrope.net/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server{
  if ($host = pullrope.net) {
    return 301 https://$host$request_uri;
  }
  server_name pullrope.net;
  listen 80;
  return 404;
}
